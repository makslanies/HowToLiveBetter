# Русская версия: проверки на каждый pull request, публикация на GitHub Pages при слиянии в main.
# Работает в форке. Старые workflow оригинала (book.yml, links.yml) на русскую версию не рассчитаны:
# в форке их стоит отключить (Actions → выбрать workflow → Disable) или удалить.
# Pages надо включить один раз: Settings → Pages → Source: GitHub Actions.
name: Русская версия

on:
  push:
    branches: [main]
    paths:
      - ru/**
      - index.html
      - tools/ru/**
      - .github/workflows/ru-site.yml
  pull_request:
    paths:
      - ru/**
      - index.html
      - tools/ru/**
      - .github/workflows/ru-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ru-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверка структуры, сносок и утечек
        run: node tools/ru/build.mjs --check

  build:
    name: Сборка
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Собрать сайт и офлайн-файл
        run: |
          node tools/ru/build.mjs \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - name: Проверить структуру Китая и России на всех страницах
        run: node --test tools/ru/country-fields.test.mjs tools/ru/prices.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: HowToLiveBetter-ru-offline
          path: dist-ru/HowToLiveBetter-ru.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-ru/site

  deploy:
    name: Публикация
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
