server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;
    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/markdown application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # главная грузит один corpus.json; кэш на час — после деплоя достаточно обновить страницу
    location = /corpus.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* \.pdf$ {
        types { application/pdf pdf; }
        default_type application/pdf;
        add_header Cache-Control "public, max-age=86400";
    }
}
