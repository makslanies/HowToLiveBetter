server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;
    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/markdown application/javascript application/json application/xml image/svg+xml;

    # Заголовки безопасности. nginx не наследует add_header в location, где есть свой
    # add_header (Cache-Control), поэтому ниже они повторены в каждом таком блоке.
    # CSP разрешает: сам сайт, Яндекс Метрику, Google Tag Manager/Analytics, Cloudflare
    # Worker формы «Предложить правку» (воркер на *.workers.dev — поправьте домен, если он свой).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru https://www.google-analytics.com; connect-src 'self' https://mc.yandex.ru https://www.google-analytics.com https://*.workers.dev; form-action 'self' https://*.workers.dev; frame-ancestors 'self'; base-uri 'self'" always;

    # своя страница вместо пустого nginx 404: ссылка на главную и оглавление
    error_page 404 /404.html;
    error_page 403 /404.html;

    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # главная грузит один corpus.json; кэш на час — после деплоя достаточно обновить страницу
    location = /corpus.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location ~* \.pdf$ {
        types { application/pdf pdf; }
        default_type application/pdf;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
